<!-- Block and general instructions, opened from the buttons in the page header.
     They open as dialogs over the page, so the page content never moves. -->
<div class="modal fade instructions-modal" id="block-instructions-modal" tabindex="-1" aria-labelledby="block-instructions-title" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="block-instructions-title">Instrucciones del bloque</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                {{ include_sibling 'instructions_body.html' }}
            </div>
        </div>
    </div>
</div>

<div class="modal fade instructions-modal" id="general-instructions-modal" tabindex="-1" aria-labelledby="general-instructions-title" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="general-instructions-title">Instrucciones generales</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                {{ include '../_templates/global/general_instructions.html' }}
            </div>
        </div>
    </div>
</div>
