# ======================================================
# BEXPULSE — lazy resolution (no crash if not running)
# Shared by both HTTP (direct IP) and HTTPS (bexintel.com) servers
# ======================================================

# React Vite assets (CSS / JS)
location /BexPulseParticipant/assets/ {
    set $bp_frontend "bexpulse_frontend";
    proxy_pass http://$bp_frontend/assets/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    expires 1y;
    add_header Cache-Control "public, immutable";

    include /etc/nginx/mime.types;
}

# Django static files
location /BexPulseParticipant/static/ {
    alias /app/bexpulse/staticfiles/;

    expires 1y;
    add_header Cache-Control "public, immutable";

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
}

# Django media files
location /BexPulseParticipant/media/ {
    alias /app/bexpulse/media/;

    expires 30d;
    add_header Cache-Control "public";

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
}

# Django API
location /BexPulseParticipant/api/ {
    rewrite ^/BexPulseParticipant/api/(.*)$ /api/$1 break;

    set $bp_backend "bexpulse_backend";
    proxy_pass http://$bp_backend:8001;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_intercept_errors on;
    error_page 502 503 504 = @bexpulse_unavailable;
}

# Django Admin
location /BexPulseParticipant/admin/ {
    rewrite ^/BexPulseParticipant/admin/(.*)$ /admin/$1 break;

    set $bp_backend "bexpulse_backend";
    proxy_pass http://$bp_backend:8001;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# React SPA (fallback)
location /BexPulseParticipant/ {
    set $bp_frontend "bexpulse_frontend";
    proxy_pass http://$bp_frontend/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
}

# Enforce trailing slash
location = /BexPulseParticipant {
    return 301 $scheme://$host/BexPulseParticipant/;
}

# BEXPULSE FALLBACK ERROR
location @bexpulse_unavailable {
    default_type text/html;
    return 503 '<html><body><h1>503 Service Unavailable</h1>
    <p>BexPulseParticipant no está disponible.</p></body></html>';
}
