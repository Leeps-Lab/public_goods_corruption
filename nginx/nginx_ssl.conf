events {
    worker_connections 1024;
}

http {
    # Docker DNS resolver — needed for lazy upstream resolution
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # =========================
    # HTTP → HTTPS (bexintel.com)
    # =========================
    server {
        listen 80;
        server_name bexintel.com www.bexintel.com;

        # Required for certbot HTTP-01 validation / renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://www.bexintel.com$request_uri;
        }
    }

    # =========================
    # HTTP fallback (direct IP / no domain) — same behavior as nginx.conf
    # =========================
    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 20M;

        include /etc/nginx/snippets/bexpulse-locations.conf;

        location / {
            set $otree_upstream "otree";
            proxy_pass http://$otree_upstream:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log;
    }

    # =========================
    # HTTPS non-www → www
    # =========================
    server {
        listen 443 ssl;
        server_name bexintel.com;

        ssl_certificate     /etc/letsencrypt/live/bexintel.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bexintel.com/privkey.pem;

        return 301 https://www.bexintel.com$request_uri;
    }

    # =========================
    # HTTPS MAIN SERVER (bexintel.com)
    # =========================
    server {
        listen 443 ssl;
        server_name www.bexintel.com;

        # SSL
        ssl_certificate         /etc/letsencrypt/live/bexintel.com/fullchain.pem;
        ssl_certificate_key     /etc/letsencrypt/live/bexintel.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/bexintel.com/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        client_max_body_size 20M;

        include /etc/nginx/snippets/bexpulse-locations.conf;

        # =========================
        # DATA EXPORTS (on-demand, auth handled by export_service itself)
        # HTTPS-only on purpose — Basic Auth creds must never travel over
        # plain HTTP. Not exposed on the direct-IP HTTP fallback server.
        # =========================
        location /exports/ {
            set $export_upstream "export_service";
            proxy_pass http://$export_upstream:5000/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120;
        }

        # OTREE — DEFAULT APP (lazy resolution, won't crash nginx if otree is down)
        location / {
            set $otree_upstream "otree";
            proxy_pass http://$otree_upstream:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log;
    }
}
