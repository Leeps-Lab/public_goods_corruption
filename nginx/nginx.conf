events {
    worker_connections 1024;
}

http {
    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # =========================
    # UPSTREAMS
    # =========================
    upstream otree_backend {
        server otree:8000;
    }

    upstream bexpulse_backend {
        server bexpulse_backend:8000;
    }

    upstream bexpulse_frontend {
        server bexpulse_frontend:80;
    }

    # WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # =========================
    # HTTP → HTTPS
    # =========================
    server {
        listen 80;
        server_name bexintel.com www.bexintel.com;

        location / {
            return 301 https://www.bexintel.com$request_uri;
        }
    }

    # =========================
    # HTTPS non-www → www
    # =========================
    server {
        listen 443 ssl;
        server_name bexintel.com;

        ssl_certificate     /etc/nginx/ssl/certificate.crt;
        ssl_certificate_key /etc/nginx/ssl/private.key;

        return 301 https://www.bexintel.com$request_uri;
    }

    # =========================
    # HTTPS MAIN SERVER
    # =========================
    server {
        listen 443 ssl;
        server_name www.bexintel.com;

        # =========================
        # SSL
        # =========================
        ssl_certificate         /etc/nginx/ssl/certificate.crt;
        ssl_certificate_key     /etc/nginx/ssl/private.key;
        ssl_trusted_certificate /etc/nginx/ssl/ca_bundle.crt;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # =========================
        # SECURITY HEADERS
        # =========================
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        client_max_body_size 20M;

        # ======================================================
        # BEXPULSE — ORDER MATTERS
        # ======================================================

        # 🔹 React Vite assets (CSS / JS)
        location /BexPulseParticipant/assets/ {
            proxy_pass http://bexpulse_frontend/assets/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            expires 1y;
            add_header Cache-Control "public, immutable";

            include /etc/nginx/mime.types;
        }

        # 🔹 Django static files
        location /BexPulseParticipant/static/ {
            alias /app/bexpulse/staticfiles/;

            expires 1y;
            add_header Cache-Control "public, immutable";

            include /etc/nginx/mime.types;
            default_type application/octet-stream;
        }

        # 🔹 Django media files
        location /BexPulseParticipant/media/ {
            alias /app/bexpulse/media/;

            expires 30d;
            add_header Cache-Control "public";

            include /etc/nginx/mime.types;
            default_type application/octet-stream;
        }

        # 🔹 Django API
        location /BexPulseParticipant/api/ {
            rewrite ^/BexPulseParticipant/api/(.*)$ /api/$1 break;
            proxy_pass http://bexpulse_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_intercept_errors on;
            error_page 502 503 504 = @bexpulse_unavailable;
        }

        # 🔹 Django Admin
        location /BexPulseParticipant/admin/ {
            rewrite ^/BexPulseParticipant/admin/(.*)$ /admin/$1 break;
            proxy_pass http://bexpulse_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 🔹 React SPA (fallback)
        location /BexPulseParticipant/ {
            proxy_pass http://bexpulse_frontend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # 🔹 Enforce trailing slash
        location = /BexPulseParticipant {
            return 301 https://www.bexintel.com/BexPulseParticipant/;
        }

        # =========================
        # BEXPULSE FALLBACK ERROR
        # =========================
        location @bexpulse_unavailable {
            default_type text/html;
            return 503 '<html><body><h1>503 Service Unavailable</h1>
            <p>BexPulseParticipant no está disponible.</p></body></html>';
        }

        # =========================
        # OTREE — DEFAULT APP
        # =========================
        location / {
            proxy_pass http://otree_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # =========================
        # LOGS
        # =========================
        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log;
    }
}
