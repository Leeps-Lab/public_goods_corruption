events {
    worker_connections 1024;
}

http {
    # Docker DNS resolver — needed for lazy upstream resolution
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # =========================
    # MAIN SERVER (HTTP only, no domain required)
    # =========================
    server {
        listen 80;
        server_name _;

        client_max_body_size 20M;

        # ======================================================
        # CERTBOT — HTTP-01 validation / renewal (webroot method)
        # certbot runs on the host and writes challenge files to
        # /var/www/certbot, which is bind-mounted read-only here.
        # ======================================================
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ======================================================
        # BEXPULSE — lazy resolution (no crash if not running)
        # ======================================================

        # React Vite assets (CSS / JS)
        location /BexPulseParticipant/assets/ {
            set $bp_frontend "bexpulse_frontend";
            proxy_pass http://$bp_frontend/assets/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 1y;
            add_header Cache-Control "public, immutable";

            include /etc/nginx/mime.types;
        }

        # Django static files
        location /BexPulseParticipant/static/ {
            alias /app/bexpulse/staticfiles/;

            expires 1y;
            add_header Cache-Control "public, immutable";

            include /etc/nginx/mime.types;
            default_type application/octet-stream;
        }

        # Django media files
        location /BexPulseParticipant/media/ {
            alias /app/bexpulse/media/;

            expires 30d;
            add_header Cache-Control "public";

            include /etc/nginx/mime.types;
            default_type application/octet-stream;
        }

        # Django API
        location /BexPulseParticipant/api/ {
            rewrite ^/BexPulseParticipant/api/(.*)$ /api/$1 break;

            set $bp_backend "bexpulse_backend";
            proxy_pass http://$bp_backend:8001;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 502 503 504 = @bexpulse_unavailable;
        }

        # Django Admin
        location /BexPulseParticipant/admin/ {
            rewrite ^/BexPulseParticipant/admin/(.*)$ /admin/$1 break;

            set $bp_backend "bexpulse_backend";
            proxy_pass http://$bp_backend:8001;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React SPA (fallback)
        location /BexPulseParticipant/ {
            set $bp_frontend "bexpulse_frontend";
            proxy_pass http://$bp_frontend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # Enforce trailing slash
        location = /BexPulseParticipant {
            return 301 http://$host/BexPulseParticipant/;
        }

        # =========================
        # BEXPULSE FALLBACK ERROR
        # =========================
        location @bexpulse_unavailable {
            default_type text/html;
            return 503 '<html><body><h1>503 Service Unavailable</h1>
            <p>BexPulseParticipant no está disponible.</p></body></html>';
        }

        # =========================
        # OTREE — DEFAULT APP
        # =========================
        location / {
            proxy_pass http://otree:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # =========================
        # LOGS
        # =========================
        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log;
    }
}
